name: Trigger auto deployment for invoice-server-stg

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ featureMarydev ]
    paths:
    - '**'
    - '.github/workflows/invoice-server-stg-AutoDeployTrigger-f0e08d60-f969-491e-9b8b-308ea2adaa5c.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.INVOICESERVERSTG_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.INVOICESERVERSTG_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.INVOICESERVERSTG_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/matias-invoice-service
          dockerfilePath: Dockerfile
          registryUrl: ecregistrystg.azurecr.io
          registryUsername: ${{ secrets.INVOICESERVERSTG_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.INVOICESERVERSTG_REGISTRY_PASSWORD }}
          containerAppName: invoice-server-stg
          resourceGroup: rg-server
          imageToBuild: ecregistrystg.azurecr.io/invoice-server-stg:${{ github.sha }}


